{% extends 'base.html' %}
{% block content %}

<h2 class="mt-4">Update Record</h2>

{% if records %}
<form method="POST" action="{% url 'record_update' records.id %}">
    {% csrf_token %}
    <div class="row">
    <div class="col-md-6 mb-3">
        <label for="first_name" class="form-label">First Name</label>
        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ records.first_name }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="last_name" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ records.last_name }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ records.email }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ records.phone }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ records.address }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control" id="city" name="city" value="{{ records.city }}" required>
    </div>
    <div class="col-md-6 mb-3">
        <label for="zipcode" class="form-label">Zipcode</label>
        <input type="text" class="form-control" id="zipcode" name="zipcode" value="{{ records.zipcode }}" required>
    </div>
    </div>
  
    <button type="submit" class="btn btn-primary">Update Record</button>
</form>


{% else %}
    <p>Record not found.</p>
{% endif %}
{% endblock %}
